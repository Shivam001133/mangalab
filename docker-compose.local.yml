volumes:
  mangalab_local_postgres: {}
  mangalab_local_postgres_backups: {}
  mangalab_local_redis: {}

networks:
  mangalabs_s:
    driver: bridge

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: manga_lab_local_django
    container_name: mangalab_local_django
    environment:
      - ELASTICSEARCH_HOST=elasticsearch
    depends_on:
      - postgres
      - redis
      - elasticsearch
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - '8000:8000'
    command: /start
    networks:
      - mangalabs_s

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: manga_lab_production_postgres
    container_name: mangalab_local_postgres
    volumes:
      - mangalab_local_postgres:/var/lib/postgresql/data
      - mangalab_local_postgres_backups:/backups
    env_file:
      - ./.envs/.local/.postgres
    networks:
      - mangalabs_s

  redis:
    image: docker.io/redis:6
    container_name: mangalab_local_redis
    
    volumes:
      - mangalab_local_redis:/data
    networks:
      - mangalabs_s

  celeryworker:
    <<: *django
    image: manga_lab_local_celeryworker
    container_name: mangalab_local_celeryworker
    depends_on:
      - redis
      - postgres
    ports: []
    command: /start-celeryworker
    networks:
      - mangalabs_s

  celerybeat:
    <<: *django
    image: manga_lab_local_celerybeat
    container_name: mangalab_local_celerybeat
    depends_on:
      - redis
      - postgres
    ports: []
    command: /start-celerybeat
    networks:
      - mangalabs_s

  flower:
    <<: *django
    image: manga_lab_local_flower
    container_name: mangalab_local_flower
    ports:
      - '5555:5555'
    command: /start-flower
    networks:
      - mangalabs_s
  
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.4.3
    container_name: mangalab_local_elasticsearch
    environment:
      - cluster.name=es
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - '9520:9520'
      - '9530:9530'
    volumes:
      - ./esdata-8:/var/lib/elasticsearch/data
    networks:
      - mangalabs_s