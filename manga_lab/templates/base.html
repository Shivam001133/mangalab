{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}VoyceMe Clone{% endblock %}</title>

    <!-- Tailwind CSS + DaisyUI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.18/dist/full.min.css" rel="stylesheet" />

    <!-- Tailwind Config for Custom Colors -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              main: '#092635',        // Deep Navy Background
              secondary: '#1B4242',   // Tealish Dark for navbar/cards
              accent: '#5C8374',      // Sage accents/icons
              highlight: '#9EC8B9',   // Mint Cream headings/CTAs
            }
          }
        }
      }
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="bg-main text-highlight min-h-screen font-sans">

    <!-- Navbar -->
    {% include "pages/navbar.html" %}

    <!-- Page Content -->
    <main class="pt-20 text-accent">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    {% include "pages/footer.html" %}

</body>
</html>
